{% extends "base.html" %}
{% block title %}Iniciar Sesión — FitTracker{% endblock %}

{% block content %}
<section class="duo-card" style="margin-top: 1rem; display: flex; flex-direction: column; gap: 1rem;">
  <div>
    <h1 style="font-size: 1.65rem;">¡Bienvenido de vuelta!</h1>
    <p style="margin: 0; color: var(--color-pencil-gray); font-weight: 700;">
      Entrena y registra tus series en menos de 10 segundos.
    </p>
  </div>

  <div id="auth-error-msg" class="duo-card" style="background-color: #ffe5e5; border-color: var(--color-danger-red); color: var(--color-night-ink); font-weight: 700;" hidden></div>

  <form id="form-login" style="display: flex; flex-direction: column; gap: 0.85rem;">
    <div>
      <label for="login-email" class="stepper-label">Correo electrónico</label>
      <input id="login-email" type="email" class="duo-input" placeholder="tu@correo.com" required autocomplete="email">
    </div>
    <div>
      <label for="login-password" class="stepper-label">Contraseña</label>
      <input id="login-password" type="password" class="duo-input" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn-duo btn-duo--green btn-duo--block btn-duo--giant">
      ENTRAR A ENTRENAR
    </button>
  </form>

  <a href="{{ url_for('auth.vista_registro') }}" class="btn-duo btn-duo--blue btn-duo--block">
    CREAR CUENTA NUEVA
  </a>
</section>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('auth-error-msg');
    errorEl.hidden = true;
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      errorEl.textContent = data.error || 'Credenciales incorrectas.';
      errorEl.hidden = false;
      return;
    }
    window.location.href = '/';
  });
</script>
{% endblock %}
