<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#58cc02">
  <script>
    // Zona horaria del navegador para que el servidor calcule el "hoy" local (no UTC).
    try {
      // Los nombres IANA (p. ej. America/Bogota) solo usan caracteres válidos en cookies.
      var ftTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      // Si el servidor renderizó esta página sin conocer la zona, la vista debe recalcular el día.
      window.ftZonaHorariaNueva = document.cookie.indexOf('ft_tz=' + ftTz) === -1;
      document.cookie = 'ft_tz=' + ftTz + '; path=/; max-age=31536000; SameSite=Lax';
    } catch (_) {}
  </script>
  <title>{% block title %}FitTracker — Entrena en &lt;10s{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="mobile-shell">
    <header class="top-header">
      <a href="{{ url_for('sesion.vista_entrenar') }}" class="brand-badge">
        <span class="brand-dot"></span>
        <span>FitTracker</span>
      </a>
      <div class="header-actions">
        <span id="offline-sync-badge" class="sync-pill" hidden>0 series sin enviar</span>
      </div>
    </header>

    <main class="main-content">
      {% block content %}{% endblock %}
    </main>

    {% if current_user.is_authenticated and not ocultar_navegacion %}
    <nav class="bottom-nav" aria-label="Navegación principal">
      <a href="{{ url_for('sesion.vista_entrenar') }}"
         class="bottom-nav__item {% if active_tab == 'entrenar' %}is-active{% endif %}"
         {% if active_tab == 'entrenar' %}aria-current="page"{% endif %}>
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Hoy</span>
      </a>
      <a href="{{ url_for('rutina.vista_rutinas') }}"
         class="bottom-nav__item {% if active_tab == 'rutinas' %}is-active{% endif %}"
         {% if active_tab == 'rutinas' %}aria-current="page"{% endif %}>
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Rutinas</span>
      </a>
      <a href="{{ url_for('resumen.vista_progreso') }}"
         class="bottom-nav__item {% if active_tab == 'progreso' %}is-active{% endif %}"
         {% if active_tab == 'progreso' %}aria-current="page"{% endif %}>
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 19h16M7 15v-4M12 15V8M17 15V5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Progreso</span>
      </a>
      <a href="{{ url_for('auth.vista_perfil') }}"
         class="bottom-nav__item {% if active_tab == 'perfil' %}is-active{% endif %}"
         {% if active_tab == 'perfil' %}aria-current="page"{% endif %}>
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4.5 20a7.5 7.5 0 0115 0" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Perfil</span>
      </a>
    </nav>
    {% endif %}
  </div>

  <script src="{{ url_for('static', filename='js/hojas.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
